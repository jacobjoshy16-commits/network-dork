[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "network-dork"
version = "0.1.0"
description = "Local, read-only investigation of existing network security alerts"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    # typer 0.15.2 calls click's Parameter.make_metavar() without a ctx
    # argument, which click 8.2 made required, so every --help in the CLI
    # raises TypeError on click 8.2+. Pin below that until typer is bumped.
    "click==8.1.8",
    "httpx==0.28.1",
    "pydantic==2.11.3",
    "PyYAML==6.0.2",
    "structlog==25.2.0",
    "typer==0.15.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
]

[project.scripts]
network-dork = "network_dork.__main__:app"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
